name: Deploy to GitHub Pages

# Builds the static export and publishes it to the `gh-pages` branch.
# After the first successful run, set repo Settings → Pages →
# Source = "Deploy from a branch" → Branch: gh-pages → / (root).

on:
  push:
    branches: ["claude/funny-dijkstra-QWsVk", "main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /GalvBot
      STATIC_EXPORT: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Static export can't include POST route handlers (no Node server on
      # Pages). The app falls back to in-browser scan extraction, so we drop
      # the server route for the static build only.
      - name: Remove server-only API routes for static export
        run: rm -rf app/api

      - run: npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          # peaceiris adds .nojekyll automatically so _next/ is served.
