name: Deploy to GitHub Pages

# Publishes the static export to GitHub Pages. Requires repo Settings → Pages →
# Source = "GitHub Actions" (this workflow also attempts to enable it).

on:
  push:
    branches: ["claude/funny-dijkstra-QWsVk", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Project site lives at https://<user>.github.io/GalvBot/
      NEXT_PUBLIC_BASE_PATH: /GalvBot
      STATIC_EXPORT: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Static export can't include POST route handlers (no Node server on
      # Pages). The app falls back to in-browser scan extraction, so we drop
      # the server route for the static build only.
      - name: Remove server-only API routes for static export
        run: rm -rf app/api

      - run: npm run build

      - name: Disable Jekyll (preserve _next directory)
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
